version: "3.9"

# ============================================================
# KLASS — Configuration Docker Compose
# Lancer avec: docker compose up
# ============================================================

services:

  # ---- Base de données PostgreSQL ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-klass}
      POSTGRES_USER: ${POSTGRES_USER:-klass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klassdev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-klass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis (broker Celery + cache) ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Application Web Django ----
  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate_schemas --shared &&
             python manage.py migrate_schemas &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-klass}:${POSTGRES_PASSWORD:-klassdev}@db:5432/${POSTGRES_DB:-klass}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-changeme-docker-dev}
      DEBUG: "false"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- Celery Worker (tâches asynchrones) ----
  worker:
    build: .
    restart: unless-stopped
    command: celery -A config.celery worker --loglevel=info --concurrency=2
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-klass}:${POSTGRES_PASSWORD:-klassdev}@db:5432/${POSTGRES_DB:-klass}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-changeme-docker-dev}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- Celery Beat (tâches planifiées) ----
  beat:
    build: .
    restart: unless-stopped
    command: celery -A config.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-klass}:${POSTGRES_PASSWORD:-klassdev}@db:5432/${POSTGRES_DB:-klass}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-changeme-docker-dev}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  postgres_data:
  media_data:
  static_data:
