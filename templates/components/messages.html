{% if messages %}
<div class="messages-container mb-3">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags }} alert-dismissible fade show d-flex align-items-center" role="alert">
    {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill me-2"></i>
    {% elif message.tags == 'danger' %}<i class="bi bi-exclamation-triangle-fill me-2"></i>
    {% elif message.tags == 'warning' %}<i class="bi bi-exclamation-circle-fill me-2"></i>
    {% else %}<i class="bi bi-info-circle-fill me-2"></i>
    {% endif %}
    {{ message }}
    <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Fermer"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
