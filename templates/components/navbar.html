{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm" id="klass-navbar">
  <div class="container-fluid">
    <!-- Logo / Nom école -->
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
      {% if school_logo %}
        <img src="{{ school_logo.url }}" alt="{{ school_name }}" height="32" class="rounded" />
      {% else %}
        <i class="bi bi-mortarboard-fill fs-5"></i>
      {% endif %}
      <span class="d-none d-sm-inline">{{ school_name|default:'KLASS' }}</span>
    </a>

    <!-- Bouton collapse mobile -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav ms-auto align-items-center gap-1">
        <!-- Notifications (portail uniquement pour l'instant) -->
        {% if is_portal_user %}
        <li class="nav-item">
          <a class="nav-link position-relative" href="#" title="Notifications">
            <i class="bi bi-bell fs-5"></i>
          </a>
        </li>
        {% endif %}

        <!-- Profil utilisateur -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center gap-1" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle fs-5"></i>
            <span class="d-none d-md-inline">{{ user.get_full_name }}</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end shadow">
            <li>
              <span class="dropdown-item-text small text-muted">
                <i class="bi bi-shield-check me-1"></i>{{ user.get_role_display }}
              </span>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <a class="dropdown-item" href="#">
                <i class="bi bi-person me-2"></i>Mon profil
              </a>
            </li>
            <li>
              <a class="dropdown-item text-danger" href="{% url 'accounts:logout' %}">
                <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
