{% extends "base.html" %}
{% block title %}Accès refusé — 403{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center"
     style="min-height:calc(100vh - 120px);padding:2rem;">
  <div style="position:relative;margin-bottom:1rem;">
    <div style="font-size:7rem;font-weight:900;color:var(--klass-red);opacity:.08;line-height:1;user-select:none;">403</div>
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:20px;background:rgba(239,68,68,.1);display:flex;align-items:center;justify-content:center;">
      <i class="bi bi-shield-x" style="font-size:2rem;color:var(--klass-red);"></i>
    </div>
  </div>
  <h1 class="fw-bold mb-2" style="font-size:1.5rem;letter-spacing:-.02em;">Accès refusé</h1>
  <p class="text-muted mb-4" style="max-width:360px;font-size:.9rem;">
    Vous n'avez pas les permissions nécessaires pour accéder à cette page.
  </p>
  <div class="d-flex gap-2 flex-wrap justify-content-center">
    <a href="/" class="btn btn-primary fw-semibold" style="border-radius:10px;">
      <i class="bi bi-house me-1"></i>Retour à l'accueil
    </a>
    <button onclick="history.back()" class="btn btn-outline-secondary" style="border-radius:10px;">
      <i class="bi bi-arrow-left me-1"></i>Page précédente
    </button>
  </div>
</div>
{% endblock %}
